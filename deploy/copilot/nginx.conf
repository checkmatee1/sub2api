worker_processes 1;
error_log /dev/null;
pid /var/run/nginx.pid;
events { worker_connections 128; }
http {
    map_hash_bucket_size 128;
    access_log off;
    server_tokens off;
    include /etc/nginx/auth.inc;
    map "$bearer_ok:$apikey_ok" $authorized {
        default 0;
        ~1 1;
    }
    limit_conn_zone $server_name zone=copilot_connections:1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        client_max_body_size 16m;
        set $copilot_backend http://adapter:4141;
        location = /healthz {
            default_type application/json;
            return 200 '{"gateway":"ok"}';
        }
        location = /readyz {
            proxy_pass $copilot_backend/;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @unavailable;
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"error":{"message":"Copilot adapter is not ready"}}';
        }
        location ~ ^/v1/(models|chat/completions|messages|messages/count_tokens)$ {
            if ($authorized = 0) { return 401; }
            limit_conn copilot_connections 2;
            limit_conn_status 429;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header X-Api-Key "";
            proxy_set_header Host adapter;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass $copilot_backend$request_uri;
        }
        location = /v1/responses {
            if ($authorized = 0) { return 401; }
            default_type application/json;
            return 501 '{"error":{"type":"unsupported_endpoint","message":"Use /v1/chat/completions or /v1/messages"}}';
        }
        location / { return 404; }
    }
}
